name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14      # Apple Silicon (arm64)
          - os: macos-15-intel # Intel (x86_64); macos-13 fue retirado por GitHub
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            packaging/requirements-build.txt
      - name: Versión
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0-dev"; fi
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
      - name: Instalar dependencias
        run: python -m pip install -r packaging/requirements-build.txt
      - name: Compilar
        run: python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Launcher-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Release notes
        run: |
          cat > notes.md <<'NOTES'
          ## How to install

          **macOS** (pick the `.dmg` for your Mac: `arm64` = Apple Silicon M1/M2/M3/M4, `x86_64` = Intel)
          1. Open the `.dmg` and drag **AI Launcher** to the Applications folder.
          2. The first time, **right-click the app → Open → Open** (the app isn't signed with an Apple certificate, so macOS asks for confirmation). If it still blocks it: System Settings → Privacy & Security → "Open Anyway".

          **Windows** (`Windows-x64.zip`)
          1. Unzip the `.zip` into any folder and run `AI Launcher.exe`.
          2. If the blue SmartScreen appears ("Windows protected your PC"): **More info → Run anyway** (the app isn't code-signed).
          3. On Windows 10 you may need the WebView2 runtime (it's already included on Windows 11).

          You don't need Python installed. Everything runs on your machine, with no telemetry.
          NOTES
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          generate_release_notes: true
          files: |
            artifacts/*.dmg
            artifacts/*.zip
