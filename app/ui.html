<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Launcher</title>
<style>
:root {
  --bg: #f5f5f7; --panel: #ffffff; --panel2: #fafafa; --text: #1d1d1f; --muted: #6e6e73;
  --line: #e3e3e8; --accent: #5b5bd6; --accent-text: #fff; --ok: #1f9d55; --warn: #c27c0e;
  --bad: #d43f3a; --chip: #ececf1; --code: #f0f0f4; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161618; --panel: #1f1f22; --panel2: #232327; --text: #ececf0; --muted: #9a9aa3;
    --line: #313137; --accent: #7c7cf0; --accent-text: #fff; --ok: #3ccf7c; --warn: #f0b04a;
    --bad: #ff6b63; --chip: #2c2c31; --code: #19191c; --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  display: flex; overflow: hidden; -webkit-user-select: none; user-select: none; }
input, textarea, .selectable, pre, code { -webkit-user-select: text; user-select: text; }
nav { width: 190px; flex: none; padding: 18px 10px; border-right: 1px solid var(--line); background: var(--panel2);
  display: flex; flex-direction: column; gap: 2px; }
nav h1 { font-size: 15px; margin: 0 8px 14px; letter-spacing: -.01em; }
nav button { all: unset; cursor: default; padding: 7px 10px; border-radius: 7px; display: flex; align-items: center; gap: 8px; color: var(--text); }
nav button:hover { background: var(--chip); }
nav button.active { background: var(--accent); color: var(--accent-text); }
nav .spacer { flex: 1; }
nav .mem { margin: 8px; font-size: 11px; color: var(--muted); }
.bar { height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; margin-top: 4px; }
.bar > div { height: 100%; background: var(--accent); transition: width .4s; }
.bar.hi > div { background: var(--warn); } .bar.crit > div { background: var(--bad); }
main { flex: 1; overflow: auto; padding: 22px 26px 60px; }
h2 { font-size: 20px; margin: 0 0 4px; letter-spacing: -.02em; }
h3 { font-size: 14px; margin: 22px 0 8px; }
.sub { color: var(--muted); margin-bottom: 16px; }
.card { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); margin-bottom: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.between { justify-content: space-between; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; flex: none; }
.dot.on { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
.dot.mid { background: var(--warn); }
.dot.bad { background: var(--bad); }
.err-box { background: color-mix(in srgb, var(--bad) 10%, transparent); border: 1px solid var(--bad); border-radius: 9px; padding: 10px 12px; margin: 10px 0 4px; flex-basis: 100%; }
.err-box details { margin: 8px 0; } .err-box summary { cursor: default; color: var(--muted); }
.err-box pre { max-height: 220px; overflow: auto; white-space: pre-wrap; margin: 6px 0 0; font-size: 11.5px; }
.title { font-weight: 600; font-size: 14px; }
.muted { color: var(--muted); }
.small { font-size: 11.5px; }
.mono { font-family: "SF Mono", ui-monospace, Menlo, Consolas, "Cascadia Mono", monospace; font-size: 11.5px; }
.chip { background: var(--chip); border-radius: 5px; padding: 1px 6px; font-size: 11px; white-space: nowrap; }
.chip.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.chip.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
button.b { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 5px 11px; border-radius: 7px; cursor: default; }
button.b:hover { background: var(--chip); }
button.b:disabled { opacity: .45; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
button.primary:hover { filter: brightness(1.08); background: var(--accent); }
button.danger { color: var(--bad); }
button.danger.solid { background: var(--bad); border-color: var(--bad); color: #fff; }
button.link { all: unset; color: var(--accent); cursor: pointer; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 11.5px; padding: 6px 8px; border-bottom: 1px solid var(--line); }
td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.child td { color: var(--muted); font-size: 12px; padding-top: 4px; padding-bottom: 4px; }
tr.child td:first-child { padding-left: 26px; }
input[type=text], input[type=number], select, textarea {
  font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; width: 100%; }
input:focus, select:focus, textarea:focus { outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); border-color: var(--accent); }
.opt { display: grid; grid-template-columns: 250px 1fr; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); align-items: start; }
.opt:last-child { border-bottom: 0; }
.opt .name { font-family: "SF Mono", ui-monospace, Menlo, Consolas, "Cascadia Mono", monospace; font-size: 12px; word-break: break-all; }
.opt .help { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
.opt.set .name { color: var(--accent); font-weight: 600; }
.opt .ctl { display: flex; gap: 6px; align-items: center; }
.toggle { appearance: none; -webkit-appearance: none; width: 32px; height: 19px; border-radius: 10px; background: var(--chip); position: relative; flex: none; margin: 0; border: 1px solid var(--line); }
.toggle::after { content: ""; position: absolute; top: 1px; left: 1px; width: 15px; height: 15px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.toggle:checked { background: var(--accent); border-color: var(--accent); }
.toggle:checked::after { transform: translateX(13px); }
details.cat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; box-shadow: var(--shadow); }
details.cat > summary { padding: 11px 16px; font-weight: 600; cursor: default; list-style: none; display: flex; gap: 4px; }
details.cat > summary > span:last-child { margin-left: auto; font-weight: 400; }
details.cat > summary::-webkit-details-marker { display: none; }
details.cat > summary::before { content: "›"; display: inline-block; width: 14px; transition: transform .15s; color: var(--muted); }
details.cat[open] > summary::before { transform: rotate(90deg); }
details.cat > div { padding: 0 16px 6px; }
.cmd { background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; font-family: "SF Mono", ui-monospace, Menlo, Consolas, "Cascadia Mono", monospace; font-size: 11.5px; white-space: pre-wrap; word-break: break-all; }
.sticky { position: sticky; top: -22px; z-index: 5; background: var(--bg); padding: 12px 0 10px; margin-top: -12px; }
pre.log { background: var(--code); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-family: "SF Mono", ui-monospace, Menlo, Consolas, "Cascadia Mono", monospace;
  font-size: 11.5px; height: calc(100vh - 170px); overflow: auto; white-space: pre-wrap; word-break: break-all; margin: 0; }
.empty { color: var(--muted); padding: 14px 0; text-align: center; }
.progress { height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; width: 160px; }
.progress > div { height: 100%; background: var(--accent); }
.toast-wrap { position: fixed; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 50; }
.toast { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 8px; padding: 10px 14px; max-width: 380px; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
.toast.err { border-left-color: var(--bad); }
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; z-index: 60; }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
.modal p { margin: 6px 0 16px; color: var(--muted); }
.kv { display: grid; grid-template-columns: 140px 1fr; gap: 4px 12px; }
.kv > div:nth-child(odd) { color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { all: unset; padding: 5px 12px; cursor: default; }
.seg button.on { background: var(--accent); color: var(--accent-text); }
.hidden { display: none !important; }
.tip { color: var(--muted); font-size: 11.5px; margin-top: 3px; padding-left: 2px; }
.opt .help.orig { font-size: 10.5px; opacity: .75; margin-top: 4px; }
.help code, .tip code, .guide code { background: var(--code); border-radius: 4px; padding: 0 4px; font-size: 11px; }
.guide { background: color-mix(in srgb, var(--accent) 8%, var(--panel)); border: 1px solid color-mix(in srgb, var(--accent) 25%, var(--line)); border-radius: 12px; margin-bottom: 14px; }
.guide > summary { padding: 9px 14px; font-weight: 600; cursor: default; list-style: none; }
.guide > summary::-webkit-details-marker { display: none; }
.guide > summary::before { content: "›"; display: inline-block; width: 14px; transition: transform .15s; color: var(--muted); }
.guide[open] > summary::before { transform: rotate(90deg); }
.guide > div { padding: 0 14px 12px 28px; line-height: 1.6; }
.warn-box { background: color-mix(in srgb, var(--warn) 14%, transparent); border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); border-radius: 9px; padding: 9px 12px; margin: 8px 0; color: var(--text); }
.warn-box.bad { background: color-mix(in srgb, var(--bad) 13%, transparent); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
.badge { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); border-radius: 5px; padding: 0 6px; font-size: 10.5px; font-family: -apple-system, system-ui, sans-serif; font-weight: 500; margin-left: 6px; white-space: nowrap; }
.modal-body p { margin: 6px 0 16px; color: var(--muted); }
.modal-body ul { margin: 4px 0 8px; padding-left: 18px; }
.chip.btn { border: 0; font: inherit; font-size: 11px; color: var(--text); cursor: pointer; }
.chip.btn:hover { background: var(--accent); color: var(--accent-text); }
.ckpt { margin-bottom: 6px; }
.ckpt:last-child { margin-bottom: 0; }
.purpose { color: var(--muted); font-size: 12.5px; margin: 4px 0 2px; line-height: 1.35; }
.steps { margin: 8px 0; display: flex; flex-direction: column; gap: 4px; }
.step { display: flex; gap: 8px; align-items: baseline; }
.step .ic { width: 18px; text-align: center; flex: none; }
.step.running .ic { display: inline-block; animation: spin 1.2s linear infinite; }
.step.done .ic { color: var(--ok); } .step.failed .ic { color: var(--bad); }
@keyframes spin { to { transform: rotate(360deg); } }
.guide-step { display: grid; grid-template-columns: 26px 1fr; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.guide-step:last-child { border-bottom: 0; }
.guide-step .n { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--accent-text); text-align: center; line-height: 22px; font-size: 12px; font-weight: 600; }
.guide-step .tx code { background: var(--code); border-radius: 4px; padding: 0 4px; font-size: 11px; }
.codeblock { display: flex; gap: 8px; align-items: flex-start; background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-top: 6px; }
.codeblock code { flex: 1; font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; white-space: pre-wrap; word-break: break-all; }
.nav-section { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 10px 10px 2px; }
.nav-dot { margin-left: auto; }
.reqs { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 8px 0; }
.prereq { display: flex; gap: 8px; align-items: baseline; margin: 3px 0; }
</style>
</head>
<body>
<nav>
  <h1>⚡︎ AI Launcher</h1>
  <button data-view="monitor" class="active">📊 Monitor</button>
  <button data-view="ollama">🦙 Ollama</button>
  <button data-view="sd">🎨 Imagen</button>
  <button data-view="logs">📜 Logs</button>
  <button data-view="settings">⚙️ Ajustes</button>
  <div class="spacer"></div>
  <button data-view="install">＋ Instalar apps</button>
  <div class="mem" id="navMem"></div>
</nav>
<main id="main"></main>
<div class="toast-wrap" id="toasts"></div>

<script src="help.js?t=__TOKEN__"></script>
<script>
const H = window.HELP || null;
const TOKEN = "__TOKEN__";
const OS = { mac: { tray: "la barra de menú", files: "Finder", device: "la Mac" }, windows: { tray: "la bandeja del sistema", files: "el Explorador", device: "la PC" }, linux: { tray: "la bandeja", files: "el gestor de archivos", device: "la PC" } };
const os_ = () => OS[S.state?.platform] || OS.mac;
const S = { view: "monitor", state: null, mon: null, logPath: null, logOffset: null, sdFilter: "", expanded: new Set() };

// ---------------------------------------------------------------- helpers
async function api(path, body) {
  const opt = { method: body === undefined ? "GET" : "POST", headers: { "X-Token": TOKEN, "Content-Type": "application/json" } };
  if (body !== undefined) opt.body = JSON.stringify(body);
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.error) throw new Error(j.error || ("HTTP " + r.status));
  return j;
}
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function bytes(n) { n = +n || 0; const u = ["B", "KB", "MB", "GB", "TB"]; let i = 0; while (n >= 1024 && i < 4) { n /= 1024; i++; } return (i < 2 ? n.toFixed(0) : n.toFixed(1)) + " " + u[i]; }
function toast(msg, err) { const t = document.createElement("div"); t.className = "toast" + (err ? " err" : ""); t.textContent = msg; $("#toasts").appendChild(t); setTimeout(() => t.remove(), err ? 7000 : 3500); }
async function act(fn, okMsg) { try { const r = await fn(); if (okMsg) toast(okMsg); refreshMonitor(); return r; } catch (e) { toast(e.message, true); } }
function choiceBox(title, html, buttons, width) {
  return new Promise(res => {
    const bg = document.createElement("div"); bg.className = "modal-bg";
    const col = buttons.length > 2;
    bg.innerHTML = `<div class="modal" ${width ? `style="width:${width}px;max-width:92vw"` : ""}><div class="title">${esc(title)}</div><div class="modal-body">${html}</div>
      <div class="row" style="${col ? "flex-direction:column;align-items:stretch" : "justify-content:flex-end"}">${buttons.map(b => `<button class="b ${esc(b.cls || "")}" data-a="${esc(b.id)}">${esc(b.label)}</button>`).join("")}</div></div>`;
    const done = v => { document.removeEventListener("keydown", onKey, true); bg.remove(); res(v); };
    const onKey = e => { if (e.key === "Escape") done(null); };
    document.addEventListener("keydown", onKey, true);
    bg.addEventListener("click", e => { const el = e.target.closest("[data-a]"); if (el) done(el.dataset.a); else if (e.target === bg) done(null); });
    document.body.appendChild(bg);
    (bg.querySelector(".primary, .solid") || bg.querySelector("button"))?.focus();
  });
}
async function confirmBox(title, text, okLabel = "Confirmar", danger = true) {
  const r = await choiceBox(title, `<p>${esc(text)}</p>`, [{ id: "0", label: "Cancelar" }, { id: "1", label: okLabel, cls: danger ? "danger solid" : "primary" }]);
  return r === "1";
}
function promptBox(title, placeholder) {
  return new Promise(res => {
    const bg = document.createElement("div"); bg.className = "modal-bg";
    bg.innerHTML = `<div class="modal"><div class="title">${esc(title)}</div><p><input type="text" placeholder="${esc(placeholder || "")}"></p>
      <div class="row" style="justify-content:flex-end"><button class="b" data-a="0">Cancelar</button><button class="b primary" data-a="1">Guardar</button></div></div>`;
    const inp = bg.querySelector("input");
    const done = ok => { bg.remove(); res(ok ? inp.value.trim() : null); };
    bg.addEventListener("click", e => { const a = e.target.dataset.a; if (a !== undefined) done(a === "1"); else if (e.target === bg) done(false); });
    inp.addEventListener("keydown", e => { if (e.key === "Enter") done(true); if (e.key === "Escape") done(false); });
    document.body.appendChild(bg); inp.focus();
  });
}
function openUrl(url) { api("/api/open", { url }); }
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

// ---------------------------------------------------------------- navegación
document.querySelectorAll("nav button[data-view]").forEach(b => b.onclick = () => go(b.dataset.view));
function go(view) {
  if (view === "install" && S.view !== "install") S.inst.data = null;
  S.view = view;
  document.querySelectorAll("nav button[data-view]").forEach(b => b.classList.toggle("active", b.dataset.view === view));
  render();
}
let _lastView = null;
function view_changed(v) { const c = v !== _lastView; _lastView = v; if (v !== "monitor") $("#main").dataset.view = v; return c; }
function render() {
  const m = $("#main");
  const keepScroll = m.scrollTop;
  if (view_changed(S.view)) lastMonitorHtml = "";
  ({ monitor: renderMonitor, ollama: renderOllama, sd: renderSD, logs: renderLogs, settings: renderSettings, install: renderInstall })[S.view]();
  if (S.view !== "logs") m.scrollTop = keepScroll;
}

// ---------------------------------------------------------------- datos
async function loadState() { S.state = await api("/api/state"); }
let monBusy = false;
async function refreshMonitor() {
  if (monBusy) return; monBusy = true;
  try {
    S.mon = await api("/api/monitor");
    renderNavMem();
    if (S.view === "monitor") renderMonitor();
    else updateLive();
  } catch (e) { /* servidor reiniciándose */ }
  monBusy = false;
}
function renderNavMem() {
  const m = S.mon.memory, pct = m.total ? m.used / m.total * 100 : 0;
  $("#navMem").innerHTML = `Memoria ${bytes(m.used)} / ${bytes(m.total)}
    <div class="bar ${pct > 90 ? "crit" : pct > 75 ? "hi" : ""}"><div style="width:${pct.toFixed(0)}%"></div></div>`;
}
// actualiza las partes "en vivo" de otras vistas sin re-renderizar los formularios
function updateLive() {
  document.querySelectorAll("[data-live]").forEach(el => {
    const fn = LIVE[el.dataset.live]; if (!fn || pointerDown) return;
    const h = fn(el.dataset); if (el._h !== h) { el.innerHTML = h; el._h = h; }
  });
}

// ---------------------------------------------------------------- monitor
function ollamaStatus() {
  const o = S.mon?.ollama; if (!o) return ["", "…"];
  if (o.up) return ["on", "Corriendo · " + o.url.replace("http://", "")];
  if (o.running) return ["mid", "Iniciando…"];
  if (o.failure) return ["bad", "No pudo iniciar"];
  return ["", "Detenido"];
}
const kindIcon = k => k === "kohya" ? "🏋️" : k === "comfyui" ? "🧩" : "🎨";
function sdStatus(s) {
  if (s.running && s.training) return ["mid", "Entrenando un LoRA…"];
  if (s.up) return ["on", "Corriendo · " + s.url.replace("http://", "")];
  if (s.running) return ["mid", "Iniciando… (puede tardar un minuto)"];
  if (s.failure) return ["bad", "No pudo iniciar"];
  return ["", "Detenido"];
}
function errBox(f, key) {
  if (!f) return "";
  return `<div class="err-box"><b>${esc(f.hint)}</b>
    <details><summary>Ver detalle</summary><pre class="mono selectable">${esc(f.tail || "(el log está vacío)")}</pre></details>
    <div class="row"><button class="b" onclick="S.logPath=${esc(JSON.stringify(f.log))};go('logs')">Ver log completo</button>
      <button class="b" onclick="clearFailure(${esc(JSON.stringify(key))})">Descartar</button></div></div>`;
}
async function clearFailure(key) {
  try { await api("/api/failures/clear", { key }); } catch (e) {}
  lastMonitorHtml = ""; await refreshMonitor();
}
const sdFailBox = path => { const s = S.mon?.sd.find(x => x.path === path); return s && !s.running ? errBox(s.failure, s.path) : ""; };
const ollamaFailBox = () => { const o = S.mon?.ollama; return o && !o.running && !o.up ? errBox(o.failure, "ollama") : ""; };
const LIVE = {
  ollamaFail: () => ollamaFailBox(),
  sdFail: d => sdFailBox(d.path),
  ollamaStatus: () => { const [c, t] = ollamaStatus(); return `<span class="dot ${c}"></span> ${esc(t)}`; },
  ollamaButtons: () => ollamaButtons(),
  sdStatus: d => { const s = S.mon?.sd.find(x => x.path === d.path); if (!s) return ""; const [c, t] = sdStatus(s); return `<span class="dot ${c}"></span> ${esc(t)}`; },
  sdButtons: d => sdButtons(d.path),
  ollamaModels: () => ollamaModelsTable(),
  pulls: () => pullsHtml(),
  sdApi: d => sdApiHtml(d.path),
};
function ollamaButtons() {
  const o = S.mon?.ollama || {};
  const running = o.running || o.up;
  return running
    ? `<button class="b danger" onclick="stopOllama()">Detener</button>`
    : `<button class="b primary" onclick="act(()=>api('/api/ollama/start',{}),'Iniciando Ollama…')">Iniciar</button>`;
}
function sdButtons(path) {
  const s = S.mon?.sd.find(x => x.path === path) || {};
  let h = "";
  if (s.running) {
    h += `<button class="b danger" onclick="stopSD('${esc(path)}')">Detener</button>`;
    if (s.up) h += ` <button class="b" onclick="openUrl('${s.url}')">Abrir en el navegador ↗</button>`;
  } else {
    h += `<button class="b primary" onclick="startSD('${esc(path)}')">Iniciar</button>`;
  }
  return h;
}
async function stopOllama() {

async function stopSD(path) {

function sdStarted(r) { toast("Iniciando… se abrirá en " + (r.url || ("http://127.0.0.1:" + r.port)) + " (puede tardar un minuto)"); refreshMonitor(); }
function conflictBox(r) {
  const run = r.running || [], m = r.memory || {};
  const training = run.some(x => x.training);
  let h = "";
  if (run.length) {
    h += `<div class="warn-box"><b>No es recomendable tener los dos abiertos.</b><br>Los dos programas compiten por la misma memoria (en Mac, la memoria RAM y la de video son lo mismo). Todo puede ponerse muy lento, la generación puede fallar o la compu puede trabarse.</div>`;
    h += `<div class="small" style="margin:6px 0"><b>Memoria en uso ahora:</b> ${bytes(m.used)} de ${bytes(m.total)}</div>
      <ul class="small">${run.map(x => `<li>${kindIcon(x.kind)} <b>${esc(x.label)}</b> — usa ${bytes(x.rss)}${x.training ? " (entrenando)" : ""}${(x.ports || []).length ? " · puerto " + esc(x.ports.join(", ")) : ""}</li>`).join("")}</ul>`;
  }
  if (training) h += `<div class="warn-box bad"><b>Kohya está entrenando un LoRA:</b> si te quedás sin memoria, el entrenamiento puede fallar y perder el progreso.</div>`;
  if (r.port_taken) h += `<p class="small" style="margin:8px 0 14px">El puerto ${esc(r.port)} ya está en uso, así que se abrirá en el puerto ${esc(r.suggested_port)}.</p>`;
  else h += `<div style="height:8px"></div>`;
  const btns = [];
  if (run.length) btns.push({ id: "stop", label: run.length > 1 ? "Detener las apps abiertas y abrir " + r.label : "Detener " + run[0].label + " y abrir", cls: "primary" });
  btns.push({ id: "force", label: "Abrir igual en el puerto " + r.suggested_port });
  btns.push({ id: "cancel", label: "Cancelar" });
  return choiceBox("Iniciar " + r.label, h, btns, 460);
}
async function stopConflicting(r) {
  const pids = (r.running || []).map(x => x.pid);
  for (const pid of pids) { try { await api("/api/kill", { pid }); } catch (e) { toast(e.message, true); } }
  toast("Esperando que se cierre…");
  const end = Date.now() + 15000;
  while (Date.now() < end) {
    await new Promise(res => setTimeout(res, 1000));
    try {
      S.mon = await api("/api/monitor");
      const alive = new Set(S.mon.processes.flatMap(p => [p.pid, ...p.children.map(c => c.pid)]));
      if (!pids.some(p => alive.has(p))) return true;
    } catch (e) { }
  }
  toast("Tardó más de lo esperado en cerrarse.", true);
  return false;
}
async function startSD(path) {
  for (let round = 0; round < 5; round++) {
    let r;
    try { r = await api("/api/sd/start", { path }); } catch (e) { toast(e.message, true); return; }
    if (!r.conflict) { sdStarted(r); return; }
    const choice = await conflictBox(r);
    if (choice === "stop") { await stopConflicting(r); continue; }
    if (choice === "force") {
      try { sdStarted(await api("/api/sd/start", { path, port: r.suggested_port, force: true })); } catch (e) { toast(e.message, true); }
    }
    return;
  }
}
async function killProc(pid, label, force) {
  const pr = (S.mon?.processes || []).find(p => p.pid === pid);
  const training = pr?.training || (pr?.children || []).some(c => /entrenamiento/i.test(c.label));
  const ok = await confirmBox(force ? "Forzar cierre" : "Detener proceso",
    `${label} (PID ${pid})${force ? " se cierra de inmediato (SIGKILL), sin darle tiempo a guardar." : " y sus subprocesos reciben la señal para cerrarse."}` +
    (training ? " ⚠️ Está entrenando un LoRA: si lo detenés, el entrenamiento se pierde." : ""),
    force ? "Forzar" : "Detener");
  if (ok) act(() => api("/api/kill", { pid, force }), "Señal enviada a PID " + pid);
}

function ollamaModelsTable() {

function timeLeft(iso) {
  const d = (new Date(iso) - Date.now()) / 1000;
  if (!isFinite(d)) return "";
  if (d > 1e7) return "nunca (keep_alive -1)";
  if (d < 0) return "ahora";
  return d > 3600 ? "en " + (d / 3600).toFixed(1) + " h" : d > 60 ? "en " + Math.round(d / 60) + " min" : "en " + Math.round(d) + " s";
}

function optControl(o, val, onChangeName) {
  const id = "o_" + (o.name || o.flag).replace(/[^a-zA-Z0-9]/g, "_");
  const key = esc(o.name || o.flag);
  if (o.kind === "bool")
    return `<input type="checkbox" class="toggle" id="${id}" ${val === true ? "checked" : ""} onchange="${onChangeName}('${key}', this.checked)">`;
  if (o.kind === "choice") {
    const choices = o.choices || [];
    return `<select id="${id}" onchange="${onChangeName}('${key}', this.value)"><option value="">(por defecto${o.default ? ": " + esc(o.default) : ""})</option>
      ${choices.map(c => `<option ${String(val) === c ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>`;
  }
  if (o.kind === "flagvalue") {
    const v = val || {};
    return `<input type="checkbox" class="toggle" ${v.on ? "checked" : ""} onchange="${onChangeName}('${key}', {...(cur('${key}')||{}), on:this.checked})">

  let h = `<input type="${o.kind === "number" ? "number" : "text"}" id="${id}" placeholder="${esc(ph)}" value="${esc(val ?? "")}" oninput="${onChangeName}('${key}', this.value)">`;

    m.innerHTML = `<h2>＋ Instalar apps</h2><div class="card"><div class="title">No se pudo cargar</div>
      <div class="muted" style="margin:6px 0 10px">No pudimos obtener la lista de apps para instalar. (${esc(S.inst.err)})</div>
      <button class="b primary" onclick="S.inst.err=null;S.inst.data=null;renderInstall()">Reintentar</button></div>`;
    return;
  }
  const d = S.inst.data, win = d.platform === "windows" || S.state?.platform === "windows";
  const osName = win ? "Windows" : "Mac";
  m.innerHTML = `<h2>＋ Instalar apps</h2>
    <div class="sub">Instalá las apps de inteligencia artificial sin tocar la terminal.</div>
    <div class="card"><div class="title">¿Qué puedo instalar?</div>
      <ul class="small" style="margin:6px 0 8px;padding-left:18px">
        <li>🦙 <b>Ollama</b>: para chatear con una IA que corre en tu compu, sin internet.</li>
        <li>🎨 <b>Stable Diffusion, Forge y ComfyUI</b>: para crear imágenes a partir de lo que escribas. Elegí una; Stable Diffusion es la más conocida.</li>
        <li>🏋️ <b>Kohya_ss</b>: para entrenar tus propios estilos o personajes (es para usuarios más avanzados).</li>
      </ul>
      <div class="small muted">Instalar descarga varios GB desde las páginas oficiales de cada programa y puede tardar un buen rato. Si preferís hacerlo a mano, cada app tiene su guía paso a paso.</div></div>
    ${instApps().map(a => instCard(a, osName)).join("")}`;
  Object.keys(S.inst.logOff).forEach(k => S.inst.logOff[k] = null);
  instApps().forEach(a => tailInstLog(a.id));
  pollInstall();
}
function instCard(a, osName) {
  const id = a.id, jobs = S.inst.jobs, j = jobs[id], running = j?.state === "running";
  const r = a.requirements || {}, memTotal = S.mon?.memory?.total || 0;
  const lowMem = r.ram_gb && memTotal && memTotal < r.ram_gb * 2 ** 30;
  const showInstall = !a.installed || S.inst.more[id];
  const missingManual = instMissingManual(a);
  const hasAuto = instHasAutoPrereq(a);
  const canAuto = a.auto_supported && !missingManual.length;
  const why = !a.auto_supported ? (a.auto_note || "La instalación automática no está disponible en tu sistema.") : missingManual.length ? "Primero hay que resolver: " + missingManual.map(p => p.name).join(", ") + "." : "";
  let h = `<div class="card" id="inst_${esc(id)}"><div class="row between"><div class="title">${APP_ICON[id] || "📦"} ${esc(a.name)}</div>
      ${a.installed ? `<span class="chip ok">Instalado ✓</span>` : ""}</div>
    <div class="purpose">${esc(a.purpose || APP_KIND_LABEL[id] || "")}</div>`;
  if (a.installed) {
    h += `<div class="small muted" style="margin-top:6px">${(a.installed_paths || []).map(p => `<div class="mono selectable">${esc(p)}</div>`).join("") || "Ya la tenés instalada."}</div>
      <div class="row" style="margin-top:8px"><button class="b primary" onclick="goToApp('${esc(id)}')">Ir a la app</button>
      ${running ? "" : `<button class="b" onclick="S.inst.more['${esc(id)}']=!S.inst.more['${esc(id)}'];renderInstall()">${S.inst.more[id] ? "Ocultar" : "Instalar otra copia…"}</button>`}</div>`;
  }
  if (showInstall || running || j) {
    h += `<div style="${a.installed ? "margin-top:12px;border-top:1px solid var(--line);padding-top:10px" : "margin-top:6px"}">`;
    if (showInstall && !running) {
      h += `<div class="reqs small">
        <span>💾 Espacio en disco: <b>${esc(r.disk_gb)} GB</b></span>
        <span class="${lowMem ? "" : ""}" style="${lowMem ? "color:var(--warn)" : ""}">🧠 Memoria recomendada: <b>${esc(r.ram_gb)} GB</b></span>
        <span>⬇️ Descarga: <b>${esc(r.download_gb)} GB</b></span>
        <span>⏱️ Tiempo estimado: <b>${esc(r.est_minutes)} min</b></span></div>
        ${lowMem ? `<div class="warn-box small">Tu compu tiene ${bytes(memTotal)} de memoria, menos de lo recomendado (${esc(r.ram_gb)} GB). Puede funcionar lento o fallar.</div>` : ""}`;
      if ((a.prereqs || []).length) {
        h += `<div class="small"><b>Requisitos previos</b>` + a.prereqs.map(p => `<div class="prereq"><span style="color:var(--${p.ok ? "ok" : "bad"})">${p.ok ? "✓" : "✗"}</span><div><b>${esc(p.name)}</b> <span class="muted">${esc(p.detail || "")}</span>
          ${!p.ok && p.how ? `<div class="muted">${esc(p.how)}</div>` : ""}
          ${!p.ok && !p.auto && p.terminal_cmd ? `<div class="codeblock"><code class="selectable">${esc(p.terminal_cmd)}</code><button class="b" onclick="copyCmd(this)">Copiar</button></div>
            <div style="margin-top:6px"><button class="b" onclick="instOpenTerminal('${esc(id)}','${esc(p.id)}')">Abrir Terminal con el comando</button></div>` : ""}
          </div></div>`).join("") + `</div>`;
      }
      if (id !== "ollama") {
        h += `<div class="small" style="margin-top:10px"><b>Dónde se instala</b><div class="row" style="margin-top:3px"><span class="mono selectable">${esc(instFinalPath(a))}</span>
          <button class="b" onclick="instChoose('${esc(id)}')">Cambiar…</button></div></div>`;
      }
      if (hasAuto) {
        const chk = S.inst.pre[id] !== false;
        h += `<label class="row small" style="margin-top:10px"><input type="checkbox" ${chk ? "checked" : ""} onchange="S.inst.pre['${esc(id)}']=this.checked"> Instalar también lo que falte (${win_() ? "winget" : "Homebrew"})</label>`;
      }
    }
    if (!running) {
      h += `<div class="row" style="margin-top:12px">
        ${showInstall ? `<button class="b primary" ${canAuto ? "" : "disabled"} onclick="startInstall('${esc(id)}')">Instalar automáticamente</button>` : ""}
        <button class="b" onclick="S.inst.guide['${esc(id)}']=!S.inst.guide['${esc(id)}'];renderInstall()">${S.inst.guide[id] ? "Ocultar guía" : "Ver guía paso a paso"}</button>
        <button class="link" onclick="openUrl(${esc(JSON.stringify(a.official_url || ""))})">Página oficial ↗</button></div>
        ${showInstall && why ? `<div class="small muted" style="margin-top:6px">${esc(why)}</div>` : ""}
        ${showInstall && canAuto && a.auto_note ? `<div class="small muted" style="margin-top:6px">${esc(a.auto_note)}</div>` : ""}`;
    }
    h += `<div data-live="instJob" data-app="${esc(id)}">${jobHtml(id)}</div>`;
    if (j) h += `<pre class="log selectable" id="ilog_${esc(id)}" style="height:200px;margin-top:8px"></pre>`;
    h += `</div>`;
  }
  if (S.inst.guide[id] && !running) {
    h += `<div style="margin-top:12px"><div class="title">Instalación manual en ${osName}</div>` + (a.guide || []).map((g, n) => `<div class="guide-step"><div class="n">${n + 1}</div><div class="tx"><b>${esc(g.title)}</b><div>${g.text || ""}</div>
      ${g.cmd ? `<div class="codeblock"><code class="selectable">${esc(g.cmd)}</code><button class="b" onclick="copyCmd(this)">Copiar</button></div>` : ""}</div></div>`).join("") + `</div>`;
  }
  return h + `</div>`;
}
const win_ = () => S.state?.platform === "windows";
function jobHtml(id) {
  const j = S.inst.jobs[id]; if (!j) return "";
  const a = (S.inst.data?.apps || []).find(x => x.id === id) || { name: id };
  const pct = Math.round((j.progress || 0) * 100);
  const icon = { running: "◌", done: "✓", failed: "✗", skipped: "–", pending: "·" };
  let h = "";
  if (j.state === "running") h += `<div class="row between" style="margin-top:12px"><b>Instalando ${esc(a.name)}…</b><span class="small muted">${pct}%</span></div><div class="bar"><div style="width:${pct}%"></div></div>`;
  h += `<div class="steps small">` + (j.steps || []).map(s => `<div class="step ${esc(s.state)}"><span class="ic">${icon[s.state] || "·"}</span><div>${esc(s.title)}${s.detail ? ` <span class="muted">${esc(s.detail)}</span>` : ""}</div></div>`).join("") + `</div>`;
  if (j.state === "running") h += `<button class="b danger" onclick="cancelInstall('${esc(id)}')">Cancelar</button>`;
  if (j.state === "done") h += `<div class="warn-box" style="background:color-mix(in srgb,var(--ok) 14%,transparent);border-color:var(--ok)"><b>¡Listo! Ya podés usarla.</b>
      <div class="row" style="margin-top:8px"><button class="b primary" onclick="openInstalled('${esc(id)}')">Abrir ${esc(a.name)}</button></div></div>`;
  if (j.state === "failed") h += `<div class="err-box"><b>${esc(j.hint || "La instalación no se pudo completar.")}</b>
      ${j.error ? `<div class="small muted" style="margin:6px 0">${esc(j.error)}</div>` : ""}
      <div class="row">${j.log ? `<button class="b" onclick="S.logPath=${esc(JSON.stringify(j.log))};go('logs')">Ver log completo</button>` : ""}
      <button class="b primary" onclick="startInstall('${esc(id)}')">Reintentar</button></div></div>`;
  if (j.state === "cancelled") h += `<div class="warn-box">Instalación cancelada. <button class="link" onclick="startInstall('${esc(id)}')">Reintentar</button></div>`;
  return h;
}
LIVE.instJob = d => jobHtml(d.app);
async function instChoose(id) {
  try { const r = await api("/api/choose", { kind: "folder" }); if (r.path) { S.inst.parent[id] = r.path; renderInstall(); } } catch (e) { toast(e.message, true); }
}
async function instOpenTerminal(app, prereq) { try { await api("/api/install/open_terminal", { app, prereq }); toast("Se abrió la Terminal. Cuando termine, tocá “Buscar de nuevo” en Ajustes o volvé a esta pantalla."); } catch (e) { toast(e.message, true); } }
function copyCmd(btn) {
  const el = btn.closest(".codeblock").querySelector("code"), t = el.textContent;
  const done = () => { btn.textContent = "¡Copiado!"; setTimeout(() => btn.textContent = "Copiar", 1500); };
  const fb = () => {
    const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    try { document.execCommand("copy") ? done() : toast("Copiá el texto seleccionado con Ctrl/Cmd+C", true); } catch (e) { toast("Copiá el texto seleccionado con Ctrl/Cmd+C", true); }
  };
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(t).then(done, fb); else fb();
}
async function startInstall(id) {
  const a = (S.inst.data?.apps || []).find(x => x.id === id); if (!a) return;
  const r = a.requirements || {};
  const dest = id === "ollama" ? "" : `<li><b>Dónde:</b> <span class="mono">${esc(instFinalPath(a))}</span></li>`;
  const withPre = instHasAutoPrereq(a) && S.inst.pre[id] !== false;
  const c = await choiceBox("Instalar " + a.name, `<p>Se va a descargar e instalar <b>${esc(a.name)}</b> desde las fuentes oficiales.</p>
    <ul class="small"><li><b>Descarga:</b> unos ${esc(r.download_gb)} GB</li>${dest}<li><b>Espacio en disco:</b> ${esc(r.disk_gb)} GB</li><li><b>Tiempo estimado:</b> ${esc(r.est_minutes)} minutos</li>
    ${withPre ? `<li>También se instalará lo que falte (${win_() ? "winget" : "Homebrew"}).</li>` : ""}</ul>
    <p class="small">Podés seguir usando la compu mientras tanto. Si la cerrás, la instalación se interrumpe.</p>`,
    [{ id: "0", label: "Cancelar" }, { id: "1", label: "Instalar", cls: "primary" }], 440);
  if (c !== "1") return;
  try {
    const res = await api("/api/install/start", { app: id, parent: instParent(a), install_prereqs: withPre });
    S.inst.jobs[id] = { app: id, state: "running", steps: [], progress: 0, log: null };
    S.inst.logOff[id] = null;
    renderInstall();
  } catch (e) { toast(e.message, true); }
}
async function cancelInstall(id) {
  if (!await confirmBox("Cancelar la instalación", "Se frena la instalación. Lo que ya se descargó puede quedar a medias.", "Cancelar instalación")) return;
  try { await api("/api/install/cancel", { app: id }); toast("Cancelando…"); } catch (e) { toast(e.message, true); }
}
async function reloadAfterInstall() {
  try { await loadState(); } catch (e) { }
  await loadInstallers();
  lastMonitorHtml = "";
}
async function goToApp(id) {
  if (id === "ollama") return go("ollama");
  const p = (S.inst.data?.apps || []).find(x => x.id === id)?.installed_paths?.[0];
  if (p && S.state.installs.some(i => i.path === p)) { S.state.config.sd.selected = p; api("/api/config", { sd_selected: p }).catch(() => { }); }
  go("sd");
}
async function openInstalled(id) {
  await reloadAfterInstall();
  const j = S.inst.jobs[id], p = j?.result_path;
  if (id !== "ollama" && p) {
    const i = S.state.installs.find(x => x.path === p || x.path.startsWith(p));
    if (i) { S.state.config.sd.selected = i.path; api("/api/config", { sd_selected: i.path }).catch(() => { }); }
  }
  go(id === "ollama" ? "ollama" : "sd");
}
async function tailInstLog(id) {
  const j = S.inst.jobs[id], box = document.getElementById("ilog_" + id);
  if (!j?.log || !box) return;
  try {
    const off = S.inst.logOff[id];
    const r = await api(`/api/log?path=${encodeURIComponent(j.log)}${off != null ? "&offset=" + off : ""}`);
    if (r.text) { box.textContent += r.text; box.scrollTop = box.scrollHeight; }
    S.inst.logOff[id] = r.offset;
  } catch (e) { }
}
let instTimer = null;
async function pollInstall() {
  clearTimeout(instTimer);
  if (S.view !== "install" || !S.inst.data) return;
  let rerender = false;
  const mj = S.mon?.install_jobs || {};
  for (const id of Object.keys(mj)) if (!S.inst.jobs[id]) { S.inst.jobs[id] = mj[id]; rerender = true; }
  for (const id of Object.keys(S.inst.jobs)) {
    const old = S.inst.jobs[id];
    if (old.state !== "running") continue;
    try {
      const nj = await api("/api/install/status?app=" + id);
      S.inst.jobs[id] = nj;
      if (nj.state !== "running") { if (nj.state === "done") await reloadAfterInstall(); rerender = true; }
      else if (!old.log && nj.log) { rerender = true; }
    } catch (e) { }
  }
  if (S.view !== "install") return;
  if (rerender) { await renderInstall(); return; }
  updateLive();
  Object.keys(S.inst.jobs).forEach(id => S.inst.jobs[id].state === "running" && tailInstLog(id));
  if (Object.values(S.inst.jobs).some(j => j.state === "running")) instTimer = setTimeout(pollInstall, 1500);
}

// ---------------------------------------------------------------- inicio
(async () => {
  await loadState();
  const v = location.hash.slice(1); if (v) go(v); else render();
  await refreshMonitor();
  setInterval(refreshMonitor, 2500);
})();
</script>
