<title>AI Launcher</title>
<style>
:root {
  --bg: #f5f5f7; --panel: #ffffff; --panel2: #fafafa; --text: #1d1d1f; --muted: #6e6e73;
  --line: #e3e3e8; --accent: #5b5bd6; --accent-text: #fff; --ok: #1f9d55; --warn: #c27c0e;
  --bad: #d43f3a; --chip: #ececf1; --code: #f0f0f4; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161618; --panel: #1f1f22; --panel2: #232327; --text: #ececf0; --muted: #9a9aa3;
    --line: #313137; --accent: #7c7cf0; --accent-text: #fff; --ok: #3ccf7c; --warn: #f0b04a;
    --bad: #ff6b63; --chip: #2c2c31; --code: #19191c; --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  display: flex; overflow: hidden; -webkit-user-select: none; user-select: none; }
input, textarea, .selectable, pre, code { -webkit-user-select: text; user-select: text; }
nav { width: 190px; flex: none; padding: 18px 10px; border-right: 1px solid var(--line); background: var(--panel2);
  display: flex; flex-direction: column; gap: 2px; }
nav h1 { font-size: 15px; margin: 0 8px 14px; letter-spacing: -.01em; }
nav button { all: unset; cursor: default; padding: 7px 10px; border-radius: 7px; display: flex; align-items: center; gap: 8px; color: var(--text); }
nav button:hover { background: var(--chip); }
nav button.active { background: var(--accent); color: var(--accent-text); }
nav .spacer { flex: 1; }
nav .mem { margin: 8px; font-size: 11px; color: var(--muted); }
.bar { height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; margin-top: 4px; }
.bar > div { height: 100%; background: var(--accent); transition: width .4s; }
.bar.hi > div { background: var(--warn); } .bar.crit > div { background: var(--bad); }
main { flex: 1; overflow: auto; padding: 22px 26px 60px; }
h2 { font-size: 20px; margin: 0 0 4px; letter-spacing: -.02em; }
h3 { font-size: 14px; margin: 22px 0 8px; }
.sub { color: var(--muted); margin-bottom: 16px; }
.card { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); margin-bottom: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.between { justify-content: space-between; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; flex: none; }
.dot.on { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
.dot.mid { background: var(--warn); }
.dot.bad { background: var(--bad); }
.err-box { background: color-mix(in srgb, var(--bad) 10%, transparent); border: 1px solid var(--bad); border-radius: 9px; padding: 10px 12px; margin: 10px 0 4px; flex-basis: 100%; }
.err-box details { margin: 8px 0; } .err-box summary { cursor: default; color: var(--muted); }
.err-box pre { max-height: 220px; overflow: auto; white-space: pre-wrap; margin: 6px 0 0; font-size: 11.5px; }
.title { font-weight: 600; font-size: 14px; }
.muted { color: var(--muted); }
.small { font-size: 11.5px; }
.mono { font-family: "SF Mono", ui-monospace, Menlo, Consolas, "Cascadia Mono", monospace; font-size: 11.5px; }
.chip { background: var(--chip); border-radius: 5px; padding: 1px 6px; font-size: 11px; white-space: nowrap; }
.chip.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.chip.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
button.b { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 5px 11px; border-radius: 7px; cursor: default; }
button.b:hover { background: var(--chip); }
button.b:disabled { opacity: .45; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
button.primary:hover { filter: brightness(1.08); background: var(--accent); }
button.danger { color: var(--bad); }
button.danger.solid { background: var(--bad); border-color: var(--bad); color: #fff; }
button.link { all: unset; color: var(--accent); cursor: pointer; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 11.5px; padding: 6px 8px; border-bottom: 1px solid var(--line); }
td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.child td { color: var(--muted); font-size: 12px; padding-top: 4px; padding-bottom: 4px; }
tr.child td:first-child { padding-left: 26px; }
input[type=text], input[type=number], select, textarea {
  font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; width: 100%; }
input:focus, select:focus, textarea:focus { outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); border-color: var(--accent); }
.opt { display: grid; grid-template-columns: 250px 1fr; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); align-items: start; }
.opt:last-child { border-bottom: 0; }
.opt .name { font-family: "SF Mono", ui-monospace, Menlo, Consolas, "Cascadia Mono", monospace; font-size: 12px; word-break: break-all; }
.opt .help { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
.opt.set .name { color: var(--accent); font-weight: 600; }
.opt .ctl { display: flex; gap: 6px; align-items: center; }
.toggle { appearance: none; -webkit-appearance: none; width: 32px; height: 19px; border-radius: 10px; background: var(--chip); position: relative; flex: none; margin: 0; border: 1px solid var(--line); }
.toggle::after { content: ""; position: absolute; top: 1px; left: 1px; width: 15px; height: 15px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.toggle:checked { background: var(--accent); border-color: var(--accent); }
.toggle:checked::after { transform: translateX(13px); }
details.cat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; box-shadow: var(--shadow); }
details.cat > summary { padding: 11px 16px; font-weight: 600; cursor: default; list-style: none; display: flex; gap: 4px; }
details.cat > summary > span:last-child { margin-left: auto; font-weight: 400; }
details.cat > summary::-webkit-details-marker { display: none; }
details.cat > summary::before { content: "›"; display: inline-block; width: 14px; transition: transform .15s; color: var(--muted); }
details.cat[open] > summary::before { transform: rotate(90deg); }
details.cat > div { padding: 0 16px 6px; }
.cmd { background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; font-family: "SF Mono", ui-monospace, Menlo, Consolas, "Cascadia Mono", monospace; font-size: 11.5px; white-space: pre-wrap; word-break: break-all; }
.sticky { position: sticky; top: -22px; z-index: 5; background: var(--bg); padding: 12px 0 10px; margin-top: -12px; }
pre.log { background: var(--code); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-family: "SF Mono", ui-monospace, Menlo, Consolas, "Cascadia Mono", monospace;
  font-size: 11.5px; height: calc(100vh - 170px); overflow: auto; white-space: pre-wrap; word-break: break-all; margin: 0; }
.empty { color: var(--muted); padding: 14px 0; text-align: center; }
.progress { height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; width: 160px; }
.progress > div { height: 100%; background: var(--accent); }
.toast-wrap { position: fixed; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 50; }
.toast { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 8px; padding: 10px 14px; max-width: 380px; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
.toast.err { border-left-color: var(--bad); }
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; z-index: 60; }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
.modal p { margin: 6px 0 16px; color: var(--muted); }
.kv { display: grid; grid-template-columns: 140px 1fr; gap: 4px 12px; }
.kv > div:nth-child(odd) { color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { all: unset; padding: 5px 12px; cursor: default; }
.seg button.on { background: var(--accent); color: var(--accent-text); }
.hidden { display: none !important; }
.tip { color: var(--muted); font-size: 11.5px; margin-top: 3px; padding-left: 2px; }
.opt .help.orig { font-size: 10.5px; opacity: .75; margin-top: 4px; }
.help code, .tip code, .guide code { background: var(--code); border-radius: 4px; padding: 0 4px; font-size: 11px; }
.guide { background: color-mix(in srgb, var(--accent) 8%, var(--panel)); border: 1px solid color-mix(in srgb, var(--accent) 25%, var(--line)); border-radius: 12px; margin-bottom: 14px; }
.guide > summary { padding: 9px 14px; font-weight: 600; cursor: default; list-style: none; }
.guide > summary::-webkit-details-marker { display: none; }
.guide > summary::before { content: "›"; display: inline-block; width: 14px; transition: transform .15s; color: var(--muted); }
.guide[open] > summary::before { transform: rotate(90deg); }
.guide > div { padding: 0 14px 12px 28px; line-height: 1.6; }
.warn-box { background: color-mix(in srgb, var(--warn) 14%, transparent); border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); border-radius: 9px; padding: 9px 12px; margin: 8px 0; color: var(--text); }
.warn-box.bad { background: color-mix(in srgb, var(--bad) 13%, transparent); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
.badge { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); border-radius: 5px; padding: 0 6px; font-size: 10.5px; font-family: -apple-system, system-ui, sans-serif; font-weight: 500; margin-left: 6px; white-space: nowrap; }
.modal-body p { margin: 6px 0 16px; color: var(--muted); }
.modal-body ul { margin: 4px 0 8px; padding-left: 18px; }
.chip.btn { border: 0; font: inherit; font-size: 11px; color: var(--text); cursor: pointer; }
.chip.btn:hover { background: var(--accent); color: var(--accent-text); }
.ckpt { margin-bottom: 6px; }
.ckpt:last-child { margin-bottom: 0; }
.purpose { color: var(--muted); font-size: 12.5px; margin: 4px 0 2px; line-height: 1.35; }
.steps { margin: 8px 0; display: flex; flex-direction: column; gap: 4px; }
.step { display: flex; gap: 8px; align-items: baseline; }
.step .ic { width: 18px; text-align: center; flex: none; }
.step.running .ic { display: inline-block; animation: spin 1.2s linear infinite; }
.step.done .ic { color: var(--ok); } .step.failed .ic { color: var(--bad); }
@keyframes spin { to { transform: rotate(360deg); } }
.guide-step { display: grid; grid-template-columns: 26px 1fr; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.guide-step:last-child { border-bottom: 0; }
.guide-step .n { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--accent-text); text-align: center; line-height: 22px; font-size: 12px; font-weight: 600; }
.guide-step .tx code { background: var(--code); border-radius: 4px; padding: 0 4px; font-size: 11px; }
.codeblock { display: flex; gap: 8px; align-items: flex-start; background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-top: 6px; }
.codeblock code { flex: 1; font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; white-space: pre-wrap; word-break: break-all; }
.nav-section { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 10px 10px 2px; }
.nav-dot { margin-left: auto; }
.reqs { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 8px 0; }
.prereq { display: flex; gap: 8px; align-items: baseline; margin: 3px 0; }
</style>
</head>

"conflict.title":[`Iniciar {label}`,`Start {label}`,`{label} starten`,`Démarrer {label}`,`{label} を起動`,`Iniciar {label}`],
"conflict.warn":[`<b>No es recomendable tener los dos abiertos.</b><br>Los dos programas compiten por la misma memoria (en Mac, la memoria RAM y la de video son lo mismo). Todo puede ponerse muy lento, la generación puede fallar o la compu puede trabarse.`,`<b>Running both at once is not recommended.</b><br>Both programs compete for the same memory (on a Mac, RAM and video memory are the same thing). Everything can become very slow, generation may fail, or the computer may freeze.`,`<b>Beide gleichzeitig zu öffnen ist nicht empfehlenswert.</b><br>Die beiden Programme konkurrieren um denselben Speicher (beim Mac sind RAM und Grafikspeicher dasselbe). Alles kann sehr langsam werden, die Erzeugung kann fehlschlagen oder der Computer kann hängen bleiben.`,`<b>Il n'est pas recommandé d'avoir les deux ouverts en même temps.</b><br>Les deux programmes se disputent la même mémoire (sur Mac, la RAM et la mémoire vidéo sont la même chose). Tout peut devenir très lent, la génération peut échouer ou l'ordinateur peut se bloquer.`,`<b>両方を同時に起動することはおすすめしません。</b><br>2つのプログラムが同じメモリを奪い合います(Mac では RAM とビデオメモリは同じものです)。動作が非常に遅くなったり、生成が失敗したり、コンピューターがフリーズしたりすることがあります。`,`<b>Não é recomendável manter os dois abertos.</b><br>Os dois programas disputam a mesma memória (no Mac, a RAM e a memória de vídeo são a mesma coisa). Tudo pode ficar muito lento, a geração pode falhar ou o computador pode travar.`],

"conflict.kohya":[`<b>Kohya está entrenando un LoRA:</b> si te quedás sin memoria, el entrenamiento puede fallar y perder el progreso.`,`<b>Kohya is training a LoRA:</b> if you run out of memory, the training may fail and lose its progress.`,`<b>Kohya trainiert gerade ein LoRA:</b> Wenn dir der Speicher ausgeht, kann das Training fehlschlagen und der Fortschritt geht verloren.`,`<b>Kohya entraîne un LoRA :</b> si la mémoire vient à manquer, l'entraînement peut échouer et la progression être perdue.`,`<b>Kohya が LoRA をトレーニング中です:</b>メモリが不足すると、トレーニングが失敗して進行状況が失われる可能性があります。`,`<b>O Kohya está treinando um LoRA:</b> se faltar memória, o treinamento pode falhar e perder o progresso.`],

    const done = v => { document.removeEventListener("keydown", onKey, true); bg.remove(); res(v); };
    const onKey = e => { if (e.key === "Escape") done(null); };
    document.addEventListener("keydown", onKey, true);
    bg.addEventListener("click", e => { const el = e.target.closest("[data-a]"); if (el) done(el.dataset.a); else if (e.target === bg) done(null); });

async function confirmBox(title, text, okLabel = t("btn.confirm"), danger = true) {

function promptBox(title, placeholder) {

    const inp = bg.querySelector("input");

    bg.addEventListener("click", e => { const a = e.target.dataset.a; if (a !== undefined) done(a === "1"); else if (e.target === bg) done(false); });
    inp.addEventListener("keydown", e => { if (e.key === "Enter") done(true); if (e.key === "Escape") done(false); });

}

async function stopConflicting(r) {
  const pids = (r.running || []).map(x => x.pid);
  for (const pid of pids) { try { await api("/api/kill", { pid }); } catch (e) { toast(e.message, true); } }
  toast(t("toast.waitClose"));
  const end = Date.now() + 15000;
  while (Date.now() < end) {
    await new Promise(res => setTimeout(res, 1000));
    try {
      S.mon = await api("/api/monitor");
      const alive = new Set(S.mon.processes.flatMap(p => [p.pid, ...p.children.map(c => c.pid)]));
      if (!pids.some(p => alive.has(p))) return true;
    } catch (e) { }

  toast(t("toast.closeSlow"), true);

async function startSD(path) {

    if (!r.conflict) { sdStarted(r); return; }
    const choice = await conflictBox(r);
    if (choice === "stop") { await stopConflicting(r); continue; }
    if (choice === "force") {

// ---------------------------------------------------------------- Ollama
const saveOllamaEnv = debounce(() => api("/api/config", { ollama_env: S.state.config.ollama.env }).catch(e => toast(e.message, true)), 400);
function optControl(o, val, onChangeName) {
  const id = "o_" + (o.name || o.flag).replace(/[^a-zA-Z0-9]/g, "_");
  const key = esc(JSON.stringify(o.name || o.flag));
  if (o.kind === "bool")
    return `<input type="checkbox" class="toggle" id="${id}" ${val === true ? "checked" : ""} onchange="${onChangeName}(${key}, this.checked)">`;
  if (o.kind === "choice") {
    const choices = o.choices || [];
    return `<select id="${id}" onchange="${onChangeName}(${key}, this.value)"><option value="">${esc(t("opt.default", { d: o.default ? ": " + o.default : "" }))}</option>
      ${choices.map(c => `<option ${String(val) === c ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>`;
  }
  if (o.kind === "flagvalue") {
    const v = val || {};
    return `<input type="checkbox" class="toggle" ${v.on ? "checked" : ""} onchange="${onChangeName}(${key}, {...(cur(${key})||{}), on:this.checked})">
      <input type="text" placeholder="${esc(t("opt.valuePh"))}" value="${esc(v.value || "")}" oninput="${onChangeName}(${key}, {...(cur(${key})||{}), value:this.value})">`;
  }
  const ph = o.default ? t("opt.defaultPh", { v: o.default }) : "";
  let h = `<input type="${o.kind === "number" ? "number" : "text"}" id="${id}" placeholder="${esc(ph)}" value="${esc(val ?? "")}" oninput="${onChangeName}(${key}, this.value)">`;
  if (o.kind === "path") h += `<button class="b" onclick="pickPath(${key}, '${esc(onChangeName)}', '${/file|ckpt|config|\.|keyfile|certfile/i.test(o.name || o.flag) && !/dir/i.test(o.name || o.flag) ? "file" : "folder"}')">${esc(t("btn.choose"))}</button>`;
  return h;
}
async function pickPath(key, fnName, kind) {
  try { const r = await api("/api/choose", { kind }); if (r.path) { window[fnName](key, r.path); render(); } } catch (e) { toast(e.message, true); }
}
function setOllamaEnv(name, val) {
  const env = S.state.config.ollama.env;
  if (val === "" || val === false || val == null) delete env[name]; else env[name] = val;
  saveOllamaEnv();
  const row = document.getElementById("row_" + name); if (row) row.classList.toggle("set", name in env);
  $("#ollamaEnvPreview") && ($("#ollamaEnvPreview").textContent = ollamaEnvPreview());
}
function ollamaEnvPreview() {
  const env = S.state.config.ollama.env, mode = S.state.config.ollama.mode;
  const parts = Object.entries(env).map(([k, v]) => `${k}=${v === true ? 1 : JSON.stringify(String(v)).slice(1, -1).includes(" ") ? JSON.stringify(String(v)) : v}`);
  const win = S.state.platform === "windows";
  const q = p => /\s/.test(p) ? `"${p}"` : p;
  if (mode === "app") {
    if (win) return (parts.length ? parts.map(p => "set " + p).join("\n") + "\n" : "") + q(S.state.ollama.app || "ollama app.exe");
    return (parts.length ? parts.map(p => "launchctl setenv " + p.replace("=", " ")).join("\n") + "\n" : "") + `open ${q(S.state.ollama.app || "Ollama.app")}`;
  }
  if (win) return (parts.length ? parts.map(p => "set " + p).join("\n") + "\n" : "") + q(S.state.ollama.binary || "ollama") + " serve";
  return (parts.join(" ") + " " + q(S.state.ollama.binary || "ollama") + " serve").trim();
}

function suggestHtml() {
  const sg = H?.suggestions ? H.suggestions(S.mon?.memory?.total || 0) : [];
  if (!sg.length) return "";
  return `<div class="small" style="margin-top:10px"><b>${esc(t("pull.suggested"))}</b> <span class="muted">${esc(t("pull.suggestedHint"))}</span>
    ${sg.map(([n, d]) => `<div class="row" style="margin-top:4px;gap:8px"><button class="chip btn" title="${esc(d)}" onclick="$('#pullName').value=${esc(JSON.stringify(n))}">${esc(n)}</button><span class="muted">${esc(d)}</span></div>`).join("")}</div>`;
}
function ollamaInstalled() {
  const o = S.mon?.ollama;
  if (!o?.up) return `<div class="empty">${esc(t("models.startToSee"))}</div>`;
  if (!o.installed.length) return `<div class="empty">${esc(t("models.noneInstalled"))}</div>`;
  const loaded = new Set(o.loaded.map(m => m.name));
  return `<table><tr><th>${esc(t("th.model"))}</th><th>${esc(t("th.params"))}</th><th class="num">${esc(t("th.size"))}</th><th>${esc(t("th.modified"))}</th><th></th></tr>` +
    o.installed.map(m => `<tr><td><b>${esc(m.name)}</b> ${loaded.has(m.name) ? `<span class="chip ok">${esc(t("chip.inMemory"))}</span>` : ""}
        ${H?.ollamaModel ? `<div class="small muted" style="margin-top:2px;white-space:normal;max-width:420px">${H.ollamaModel(m, S.mon?.memory?.total || 0)}</div>` : ""}</td>
      <td class="small muted">${esc([m.details?.parameter_size, m.details?.quantization_level].filter(Boolean).join(" · "))}</td>
      <td class="num">${bytes(m.size)}</td><td class="small muted">${esc((m.modified_at || "").slice(0, 10))}</td>
      <td class="num" style="white-space:nowrap">
        ${loaded.has(m.name) ? `<button class="b" onclick="unloadModel(${esc(JSON.stringify(m.name))})">${esc(t("btn.unload"))}</button>`
          : `<button class="b" onclick="loadModel(${esc(JSON.stringify(m.name))})">${esc(t("btn.load"))}</button>`}
        <button class="b" onclick="api('/api/ollama/chat',{model:${esc(JSON.stringify(m.name))}})">${esc(t("btn.chat"))}</button>
        <button class="b danger" onclick="delModel(${esc(JSON.stringify(m.name))}, ${+m.size||0})">${esc(t("btn.delete"))}</button></td></tr>`).join("") + `</table>`;
}
async function delModel(name, size) {
  if (await confirmBox(t("dlg.delModel.title", { name }), t("dlg.delModel.text", { size: bytes(size) }), t("btn.delete")))
    act(() => api("/api/ollama/delete", { model: name }), t("toast.deleted", { name }));
}
async function pull() {
  const name = $("#pullName").value.trim(); if (!name) return;
  await act(() => api("/api/ollama/pull", { model: name }));
  $("#pullName").value = "";
}
function pullsHtml() {
  const p = S.mon?.pulls || {};
  const ks = Object.keys(p); if (!ks.length) return "";
  return `<table style="margin-top:10px">` + ks.map(k => {
    const x = p[k], pct = x.total ? x.completed / x.total * 100 : 0;
    return `<tr><td><b>${esc(k)}</b></td><td class="small ${x.error ? "" : "muted"}" style="${x.error ? "color:var(--bad)" : ""}">${esc(x.error || x.status)}</td>
      <td>${x.total && !x.done ? `<div class="progress"><div style="width:${pct.toFixed(1)}%"></div></div>` : ""}</td>
      <td class="num small">${x.total && !x.done ? bytes(x.completed) + " / " + bytes(x.total) : ""}</td>
      <td class="num">${x.done ? `<button class="link" onclick="api('/api/ollama/pull_clear',{model:${esc(JSON.stringify(k))}}).then(refreshMonitor)">${esc(t("btn.remove"))}</button>` : ""}</td></tr>`;
  }).join("") + `</table>`;
}

// ---------------------------------------------------------------- presets
function presetBar(service, names) {
  return `<div class="card row between"><div class="row"><span class="title" style="margin-right:6px">${esc(t("preset.title"))}</span>
    ${names.length ? names.map(n => `<span class="chip" style="padding:3px 4px 3px 8px">${esc(n)}
      <button class="link" onclick="applyPreset(${esc(JSON.stringify(service))},${esc(JSON.stringify(n))})">${esc(t("btn.use"))}</button>
      <button class="link" style="color:var(--muted)" onclick="delPreset(${esc(JSON.stringify(service))},${esc(JSON.stringify(n))})">×</button></span>`).join(" ")
      : `<span class="muted small">${esc(t("preset.empty"))}</span>`}</div>
    <button class="b" onclick="savePreset(${esc(JSON.stringify(service))})">${esc(t("btn.saveProfile"))}</button></div>`;
}
async function savePreset(service) {
  const name = await promptBox(t("preset.nameTitle"), t("preset.namePh")); if (!name) return;
  let values;
  if (service === "ollama") values = { env: S.state.config.ollama.env, mode: S.state.config.ollama.mode };
  else { const p = curInstall().path; values = { path: p, args: S.state.config.sd.args[p] || {}, extra: S.state.config.sd.extra[p] || "" }; }
  await api("/api/preset/save", { service, name, values });
  S.state.config[service].presets[name] = values; render(); toast(t("toast.profileSaved"));
}
async function applyPreset(service, name) {
  const v = S.state.config[service].presets[name];
  if (service === "ollama") {
    S.state.config.ollama.env = { ...v.env }; S.state.config.ollama.mode = v.mode || "cli";
    await api("/api/config", { ollama_env: v.env, ollama_mode: S.state.config.ollama.mode });
  } else {
    const p = curInstall().path;
    S.state.config.sd.args[p] = { ...v.args }; S.state.config.sd.extra[p] = v.extra || "";
    const r = await api("/api/config", { sd_path: p, sd_values: v.args, sd_extra: v.extra || "" });
    curInstall().preview = r.preview;
  }
  render(); toast(t("toast.profileApplied", { name }));
}
async function delPreset(service, name) {
  if (!await confirmBox(t("dlg.delProfile.title"), t("dlg.delProfile.text", { name }), t("btn.delete"))) return;
  await api("/api/preset/delete", { service, name }); delete S.state.config[service].presets[name]; render();
}

// ---------------------------------------------------------------- Stable Diffusion
function curInstall() { const sel = S.state.config.sd.selected; return S.state.installs.find(i => i.path === sel) || S.state.installs[0]; }
function cur(flag) { const i = curInstall(); return (S.state.config.sd.args[i.path] || {})[flag]; }
const saveSD = debounce(async () => {
  const i = curInstall();
  try {
    const r = await api("/api/config", { sd_path: i.path, sd_values: S.state.config.sd.args[i.path] || {}, sd_extra: S.state.config.sd.extra[i.path] || "" });
    i.preview = r.preview; const el = $("#sdPreview"); if (el) el.textContent = r.preview;
  } catch (e) { toast(e.message, true); }
}, 300);
function setSD(flag, val) {
  const i = curInstall();
  const vals = (S.state.config.sd.args[i.path] ||= {});
  const empty = val === "" || val === false || val == null || (typeof val === "object" && !val.on && !val.value);
  if (empty) delete vals[flag]; else vals[flag] = val;
  const row = document.getElementById("row_" + flag); if (row) row.classList.toggle("set", !empty);
  saveSD();
  updateCatCounts();
}
function setExtra(v) { S.state.config.sd.extra[curInstall().path] = v; saveSD(); }
async function selectInstall(path) { S.state.config.sd.selected = path; await api("/api/config", { sd_selected: path }); renderSD(); }
async function addInstall() { try { const st = await api("/api/add_install", {}); if (st.installs) { S.state = st; renderSD(); toast(t("toast.installAdded")); } } catch (e) { toast(e.message, true); } }
async function rescan(deep) {
  toast(deep ? t("toast.searchingDeep") : t("toast.searching"));
  try { S.state = await api("/api/rescan", { deep }); render(); toast(tn("toast.searchDone", S.state.installs.length)); } catch (e) { toast(e.message, true); }
}
function updateCatCounts() {
  const i = curInstall(), vals = S.state.config.sd.args[i.path] || {};
  document.querySelectorAll("[data-catcount]").forEach(el => {
    const flags = el.dataset.catcount.split(" ");
    el.textContent = t("cat.count", { n: flags.filter(f => f in vals).length, total: flags.length });
  });
}
function filterSD(q) {
  S.sdFilter = q.toLowerCase();
  document.querySelectorAll("#sdOpts .opt").forEach(el => el.classList.toggle("hidden", !!S.sdFilter && !el.dataset.search.includes(S.sdFilter)));
  document.querySelectorAll("#sdOpts details.cat").forEach(d => {
    const any = [...d.querySelectorAll(".opt")].some(o => !o.classList.contains("hidden"));
    d.classList.toggle("hidden", !any); if (S.sdFilter) d.open = true;
  });
}
const CAT_ORDER = ["Más usadas", "Red y API", "Memoria y rendimiento", "Rutas", "Interfaz", "Arranque e instalación", "Otros"];

  if (S.sdFilter && advMode()) filterSD(S.sdFilter);
}

      const nj = await api("/api/install/status?app=" + id);
      S.inst.jobs[id] = nj;
      if (nj.state !== "running") { if (nj.state === "done") await reloadAfterInstall(); rerender = true; }
      else if (!old.log && nj.log) { rerender = true; }
    } catch (e) { }
  }
  if (S.view !== "install") return;
  if (rerender) { await renderInstall(); return; }
  updateLive();
  Object.keys(S.inst.jobs).forEach(id => S.inst.jobs[id].state === "running" && tailInstLog(id));
  if (Object.values(S.inst.jobs).some(j => j.state === "running")) instTimer = setTimeout(pollInstall, 1500);
}

// ---------------------------------------------------------------- inicio
applyStatic();
I18N.onChange = () => { applyStatic(); lastMonitorHtml = ""; if (S.mon) renderNavMem(); if (S.state) render(); };
(async () => {
  await loadState();
  const v = location.hash.slice(1); if (v) go(v); else render();
  await refreshMonitor();
  setInterval(refreshMonitor, 2500);
})();
</script>
